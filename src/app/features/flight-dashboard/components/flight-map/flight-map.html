<div class="flight-map-wrapper">
  <div #mapContainer class="flight-map-container" role="application" aria-label="Interactive flight tracking map"></div>

  <div class="map-legend" aria-label="Flight status legend">
    <span class="map-legend__item"><span class="map-legend__dot map-legend__dot--active"></span>Active</span>
    <span class="map-legend__item"><span class="map-legend__dot map-legend__dot--delayed"></span>Delayed</span>
    <span class="map-legend__item"><span class="map-legend__dot map-legend__dot--arrived"></span>Arrived</span>
    <span class="map-legend__item"><span class="map-legend__dot map-legend__dot--scheduled"></span>Scheduled</span>
  </div>
</div>
