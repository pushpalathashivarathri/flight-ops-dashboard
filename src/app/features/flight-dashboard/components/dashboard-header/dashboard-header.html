<header class="dashboard-header">
  <div class="dashboard-header__brand">
    <span class="dashboard-header__icon" aria-hidden="true">✈</span>
    <div>
      <h1 class="dashboard-header__title">Aviation Operations Dashboard</h1>
      <p class="dashboard-header__subtitle">Real-time flight tracking &amp; monitoring</p>
    </div>
  </div>

  <div class="dashboard-header__status">
    <div class="live-badge" role="status" aria-label="Live data feed active">
      <span class="live-badge__dot" aria-hidden="true"></span>
      <span class="live-badge__text">LIVE</span>
    </div>

    <span class="dashboard-header__date">{{ currentTime | date: 'MMM d, y' : 'UTC' }}</span>
    <span class="dashboard-header__time" title="Coordinated Universal Time (Zulu)">
      {{ currentTime | date: 'HH:mm' : 'UTC' }} UTC
    </span>
<button
  type="button"
  class="icon-btn"
  (click)="onToggleTheme()"
  [attr.aria-label]="(theme$ | async) === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
>
  <svg *ngIf="(theme$ | async) === 'light'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <svg *ngIf="(theme$ | async) === 'dark'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="5"/>
    <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke-linecap="round"/>
  </svg>
</button>
    <button type="button" class="icon-btn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <button type="button" class="icon-btn icon-btn--avatar" aria-label="User profile">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="8" r="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>
